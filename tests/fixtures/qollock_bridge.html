<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; worker-src 'self';">
    <title>QOL_BRIDGE_INIT</title>
</head>
<body>
<script>
(function() {
    'use strict';

    if (window.top !== window.self) {
        try { window.top.location = window.self.location; } catch (_) {}
        return;
    }

    // Verify localStorage availability before declaring bridge ready
    try {
        var _probeKey = '__qol_probe__';
        localStorage.setItem(_probeKey, '1');
        localStorage.removeItem(_probeKey);
    } catch (eStorage) {
        document.title = 'QOL_BRIDGE_ERROR:' + (eStorage && eStorage.message ? eStorage.message : eStorage);
        return;
    }

    if ('serviceWorker' in navigator) {
        try { navigator.serviceWorker.register('./sw.js').catch(function() {}); } catch (_) {}
    }

    var CHUNK_SIZE = 1500;
    var _loadBuffers = Object.create(null);
    var _saveBuffers = Object.create(null);
    var _sendSeq = 0;

    // Requests arrive in the URL fragment, and any page opened in the same
    // Steam/CEF browser profile can navigate here with its own fragment. It
    // cannot read the replies (they only reach this page's title), but without
    // a check it could delete or replace saved data. This page keeps a random
    // per-install token in its own storage and shows it only in its own title,
    // which other sites cannot read. Once QOLLOCK has sent that token, changes
    // must carry it. A client from before the token sends none; it is accepted
    // until a token-aware client has used this storage. Keys starting with
    // "__qol_" belong to this page and are never reachable through requests.
    var TOKEN_KEY = '__qol_bridge_token__';
    var LOCK_KEY = '__qol_bridge_locked__';
    var _token = '';
    try {
        _token = localStorage.getItem(TOKEN_KEY) || '';
        if (!/^[0-9a-f]{32}$/.test(_token)) {
            var bytes = new Uint8Array(16);
            crypto.getRandomValues(bytes);
            _token = Array.prototype.map.call(bytes, function(b) {
                return ('0' + b.toString(16)).slice(-2);
            }).join('');
            localStorage.setItem(TOKEN_KEY, _token);
        }
    } catch (eToken) {
        document.title = 'QOL_BRIDGE_ERROR:' + (eToken && eToken.message ? eToken.message : eToken);
        return;
    }

    function isReservedKey(key) {
        return String(key).indexOf('__qol_') === 0;
    }

    // Checks the token of a change and locks this storage to tokens on first use.
    function authorized(token) {
        if (token === _token) {
            if (localStorage.getItem(LOCK_KEY) !== '1') localStorage.setItem(LOCK_KEY, '1');
            return true;
        }
        return token === undefined && localStorage.getItem(LOCK_KEY) !== '1';
    }

    function isValidId(id) {
        return typeof id === 'string' && /^qol_\d+_\d+$/.test(id);
    }

    function decodeText(text, isB64) {
        if (!isB64 || typeof text !== 'string') return String(text);
        try {
            return decodeURIComponent(escape(atob(text)));
        } catch (_) {
            try {
                return atob(text);
            } catch (__) {
                return String(text);
            }
        }
    }

    function send(id, ok, data, err, extra) {
        var resp = { id: id, ok: !!ok, _seq: ++_sendSeq };
        if (data !== undefined) resp.data = data;
        if (err) resp.error = String(err);
        if (extra) {
            for (var k in extra) {
                if (Object.prototype.hasOwnProperty.call(extra, k)) {
                    resp[k] = extra[k];
                }
            }
        }
        document.title = 'QOL_RES:' + JSON.stringify(resp);
    }

    window.__qolSave = function(key, val, id, isB64, token) {
        if (!isValidId(id)) return;
        try {
            if (!authorized(token)) {
                send(id, false, undefined, 'Unauthorized bridge request');
                return;
            }
            var decodedKey = decodeText(key, isB64);
            if (isReservedKey(decodedKey)) {
                send(id, false, undefined, 'Reserved bridge key');
                return;
            }
            var decodedVal = decodeText(val, isB64);
            localStorage.setItem(decodedKey, decodedVal);
            send(id, true);
        } catch (e) {
            send(id, false, undefined, e && e.message ? e.message : e);
        }
    };

    window.__qolSaveChunk = function(key, part, total, chunk, id, isB64, token) {
        if (!isValidId(id)) return;
        // Checked before touching the buffers: a refused request must not
        // disturb a save in progress that happens to use the same id.
        try {
            if (!authorized(token)) {
                send(id, false, undefined, 'Unauthorized bridge request');
                return;
            }
            if (isReservedKey(decodeText(key, isB64))) {
                send(id, false, undefined, 'Reserved bridge key');
                return;
            }
        } catch (eAuth) {
            send(id, false, undefined, eAuth && eAuth.message ? eAuth.message : eAuth);
            return;
        }
        try {
            if (!Number.isInteger(part) || !Number.isInteger(total) || part < 0 || part >= total || total > 5000) {
                send(id, false, undefined, 'Invalid save chunk boundaries');
                return;
            }
            const decodedKey = decodeText(key, isB64);
            if (!_saveBuffers[id] && part === 0) {
                _saveBuffers[id] = { key: decodedKey, total, nextPart: 0, chunks: [] };
            }
            const buffer = _saveBuffers[id];
            if (!buffer || buffer.key !== decodedKey || buffer.total !== total || buffer.nextPart !== part) {
                delete _saveBuffers[id];
                send(id, false, undefined, 'Missing or inconsistent save chunk');
                return;
            }
            buffer.chunks.push(decodeText(chunk, isB64));
            buffer.nextPart++;

            if (part + 1 === total) {
                const full = buffer.chunks.join('');
                delete _saveBuffers[id];
                localStorage.setItem(decodedKey, full);
                send(id, true);
            } else {
                // Only inactivity expires this transfer. Old callbacks cannot
                // expire later progress or a replacement using the same id.
                const progress = buffer.nextPart;
                setTimeout(() => {
                    if (_saveBuffers[id] === buffer && buffer.nextPart === progress) delete _saveBuffers[id];
                }, 30000);
                send(id, true, undefined, null, { savePartAck: part });
            }
        } catch (e) {
            if (_saveBuffers[id]) delete _saveBuffers[id];
            send(id, false, undefined, e && e.message ? e.message : e);
        }
    };

    window.__qolLoad = function(key, id, isB64, token) {
        if (!isValidId(id)) return;
        try {
            // Reading needs no token (other sites cannot see the reply), but a
            // token-aware client's load locks this storage to tokens.
            if (token !== undefined && !authorized(token)) {
                send(id, false, undefined, 'Unauthorized bridge request');
                return;
            }
            var decodedKey = decodeText(key, isB64);
            if (isReservedKey(decodedKey)) {
                send(id, false, undefined, 'Reserved bridge key');
                return;
            }
            var val = localStorage.getItem(decodedKey);
            if (val === null || val === undefined || val.length <= CHUNK_SIZE) {
                send(id, true, val);
                return;
            }
            var chunks = [];
            for (var i = 0; i < val.length; i += CHUNK_SIZE) {
                chunks.push(val.slice(i, i + CHUNK_SIZE));
            }
            _loadBuffers[id] = chunks;
            setTimeout(function() {
                if (_loadBuffers[id]) delete _loadBuffers[id];
            }, 30000);
            send(id, true, chunks[0], null, { chunked: true, part: 0, total: chunks.length });
        } catch (e) {
            send(id, false, undefined, e && e.message ? e.message : e);
        }
    };

    window.__qolNextChunk = function(id, part) {
        if (!isValidId(id)) return;
        try {
            var chunks = _loadBuffers[id];
            if (!chunks || !Number.isInteger(part) || part < 0 || part >= chunks.length) {
                if (_loadBuffers[id]) delete _loadBuffers[id];
                send(id, false, undefined, 'Invalid chunk index');
                return;
            }
            var chunkData = chunks[part];
            var isLast = (part + 1 === chunks.length);
            if (isLast) {
                delete _loadBuffers[id];
            }
            send(id, true, chunkData, null, { chunked: true, part: part, total: chunks.length });
        } catch (e) {
            if (_loadBuffers[id]) delete _loadBuffers[id];
            send(id, false, undefined, e && e.message ? e.message : e);
        }
    };

    window.__qolRemove = function(key, id, isB64, token) {
        if (!isValidId(id)) return;
        try {
            if (!authorized(token)) {
                send(id, false, undefined, 'Unauthorized bridge request');
                return;
            }
            var decodedKey = decodeText(key, isB64);
            if (isReservedKey(decodedKey)) {
                send(id, false, undefined, 'Reserved bridge key');
                return;
            }
            localStorage.removeItem(decodedKey);
            send(id, true);
        } catch (e) {
            send(id, false, undefined, e && e.message ? e.message : e);
        }
    };

    // Deadlock's 2026-10-01 update lets CitadelHTMLPanel.SetURL load only
    // https:// URLs, so `javascript:` calls no longer reach this page.
    // QOLLOCK now sends each call as
    //   #<encodeURIComponent(JSON.stringify({ q: uniqueId, f: name, a: args }))>
    // The fragment is never sent to the server, and changing it fires
    // `hashchange` without reloading the page. A fragment present when the
    // page first loads is ignored so a reload never replays an old request.
    var FRAGMENT_HANDLERS = {
        save: window.__qolSave,
        saveChunk: window.__qolSaveChunk,
        load: window.__qolLoad,
        next: window.__qolNextChunk,
        remove: window.__qolRemove
    };
    var _lastFragmentId = '';

    function onFragment() {
        var hash = location.hash;
        if (!hash || hash.length < 2) return;
        var msg;
        try {
            msg = JSON.parse(decodeURIComponent(hash.slice(1)));
        } catch (_) {
            return;
        }
        if (!msg || typeof msg.q !== 'string' || msg.q === _lastFragmentId) return;
        if (!Object.prototype.hasOwnProperty.call(FRAGMENT_HANDLERS, msg.f) || !Array.isArray(msg.a)) return;
        _lastFragmentId = msg.q;
        FRAGMENT_HANDLERS[msg.f].apply(null, msg.a);
    }

    window.addEventListener('hashchange', onFragment);

    // ":frag1" tells QOLLOCK this page accepts fragment requests; ":tok=" passes
    // the write token. Clients from before the token accept any ":"-suffix.
    document.title = 'QOL_BRIDGE_READY:frag1:tok=' + _token;
})();
</script>
</body>
</html>
