name: Feature request
description: Suggest an improvement to the mod.
title: "[Suggestion] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: Describe the situation or inconvenience you encounter.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Your suggestion
      description: Describe the behavior you would like. Screenshots or examples are welcome.
    validations:
      required: true
