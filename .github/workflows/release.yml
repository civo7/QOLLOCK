name: Publish prepared release
run-name: Publish QOLLOCK ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v4.0.5)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-qollock-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the tagged source and draft
        run: |
          cp scripts/validate_release.py "$RUNNER_TEMP/package-release.py"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git checkout --detach "refs/tags/$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json isDraft | jq -e '.isDraft == true'
          version=$(node -p 'require("./package.json").version')
          [[ "$RELEASE_TAG" == "v$version" ]] || exit 1
          echo "ARCHIVE=QOL-Lock-${version//./}.zip" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -p '*_automation_test.py'
      - name: Download prepared VPKs and create the release ZIP
        run: |
          gh release download "$RELEASE_TAG" --pattern '*.vpk' --dir "$RUNNER_TEMP/qollock-vpks"
          python "$RUNNER_TEMP/package-release.py" --vpks "$RUNNER_TEMP/qollock-vpks" --output "$RUNNER_TEMP/qollock-release" > "$RUNNER_TEMP/release-validation.json"
          cat "$RUNNER_TEMP/release-validation.json" >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/qollock-release/$ARCHIVE" --clobber
      - name: Publish the validated draft
        run: gh release edit "$RELEASE_TAG" --draft=false --verify-tag
