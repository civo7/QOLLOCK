name: Sync translations to public repo

# Regenerates the public mirror (Predi-i/QOLLOCK-translations) from the in-code
# dictionaries in panorama/scripts/ql_settings_loc/ and pushes new strings.
#
# This is the private -> public half of the pipeline (the same job the local
# export_locales.bat does by hand). It runs the overwrite-safe export, so it only
# adds missing strings and exports a runtime correction only while the mirror
# still matches the recorded integrated ancestor. Newer community work survives.
# The return path is reviewed scripts/sync_translations.js, not a hidden import.
#
# Required secret (in this repo, civo7/QOLLOCK):
#   PUBLIC_REPO_PAT — a fine-grained PAT with Contents: read & write on
#                     Predi-i/QOLLOCK-translations. See docs/LOCALIZATION.md.

on:
  # Daily, at an off-peak odd minute so it does not pile onto the top of the hour.
  schedule:
    - cron: '23 4 * * *'
  # Manual "Run workflow" button.
  workflow_dispatch:
  # Fallback: also run when the maps change on main.
  push:
    branches: [main]
    paths:
      - 'panorama/scripts/ql_settings.js'
      - 'panorama/scripts/ql_settings_loc/**'
      - 'scripts/export_locales_json.js'
      - 'scripts/locales_helper.js'
      - 'scripts/translation_io.js'
      - 'scripts/export_translation_context.js'
      - 'scripts/settings_localization_audit.js'
      - 'scripts/simulator/**'
      - 'panorama/scripts/ui/**'
      - 'panorama/layout/hud_escape_menu.xml'
      - 'translations/import-baseline.json'
      - '.github/workflows/sync-translations.yml'

permissions:
  contents: read

# Prevent overlapping runs from racing on the push to the public repo.
concurrency:
  group: sync-translations
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private QOLLOCK
        uses: actions/checkout@v4
        with:
          path: qollock

      - name: Checkout public QOLLOCK-translations
        uses: actions/checkout@v4
        with:
          repository: Predi-i/QOLLOCK-translations
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          path: public

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Export locales into the public mirror (overwrite-safe merge)
        run: node qollock/scripts/export_locales_json.js public/locales

      - name: Export current settings context
        run: node qollock/scripts/export_translation_context.js public/locales/qollock-context.json

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          cd public
          git config user.name "Predi-i"
          git config user.email "Predi-i@users.noreply.github.com"
          git add -- locales
          if git diff --cached --quiet; then
            echo "No new strings to sync"
            exit 0
          fi
          git commit -m "Sync translations from private QOLLOCK@${{ github.sha }}"
          git push
