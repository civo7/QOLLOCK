name: Sync translations to public repo

on:
  push:
    branches: [main]
    paths:
      - 'translations/locales/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private QOLLOCK
        uses: actions/checkout@v4
        with:
          path: qollock

      - name: Checkout public QOLLOCK-translations
        uses: actions/checkout@v4
        with:
          repository: Predi-i/QOLLOCK-translations
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          path: public

      - name: Sync locales folder
        run: |
          rsync -av --delete qollock/translations/locales/ public/locales/
          cd public
          git config user.name "QOLLOCK Bot"
          git config user.email "noreply@github.com"
          if git diff --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          git add -A
          git commit -m "Sync translations from private QOLLOCK@${{ github.sha }}

          Auto-sync triggered by push to main in private repo.

          Co-Authored-By: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
          git push
